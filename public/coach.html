<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coach · Stockfish Elo Terminal</title>
  <meta name="description" content="Your opening library, your chess.com games, and the new positions opponents show you, analysed and turned into lessons." />
  <link rel="icon" href="pieces/wN.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/coach.css" />
  <script>
    try { const t = localStorage.getItem('sfet.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body class="coach-page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><img src="pieces/wN.svg" alt="" /></span>
      <span class="brand-name">STOCKFISH <em>ELO</em> TERMINAL</span>
    </div>
    <nav class="mode-tabs" aria-label="App">
      <a href="./">Play</a>
      <a href="coach.html" aria-current="page">Coach <span class="tab-badge" data-badge hidden></span></a>
      <a href="four.html">4-Player</a>
    </nav>
    <div class="topbar-status" id="bgStatus" aria-live="polite"></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="subnav-wrap">
    <nav class="subnav" id="subnav" aria-label="Coach sections">
      <a href="#discoveries" data-sec="discoveries">Discoveries <span class="tab-badge" data-badge hidden></span></a>
      <a href="#library" data-sec="library">Library</a>
      <a href="#games" data-sec="games">Games</a>
      <a href="#review" data-sec="review">Review</a>
      <a href="#insights" data-sec="insights">Insights</a>
      <a href="#guide" data-sec="guide">Guide</a>
      <span class="subnav-ink" aria-hidden="true"></span>
    </nav>
    <div class="account" id="account"></div>
  </div>

  <main class="coach-main" id="view" tabindex="-1"></main>

  <div class="story" id="story" role="dialog" aria-modal="true" aria-label="Study a discovery" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/coach/page.js"></script>
</body>
</html>
