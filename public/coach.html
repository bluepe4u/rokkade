<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rokade</title>
  <meta name="description" content="Rokade: get better at chess a little every day. A daily session, your opening library, your games reviewed, and lessons from the moves that surprise you." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/coach.css" />
  <script>
    try { const t = localStorage.getItem('sfet.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body class="coach-page">
  <header class="topbar" data-shell="coach">
    <div class="topbar-status" id="bgStatus" data-keep aria-live="polite"></div>
  </header>

  <div class="subnav-wrap">
    <nav class="subnav" id="subnav" aria-label="Section" hidden>
      <a href="#discoveries" data-sec="discoveries" data-group="study">Discoveries <span class="tab-badge" data-badge hidden></span></a>
      <a href="#library" data-sec="library" data-group="study">Library <span class="tab-badge due-badge" id="dueBadge" hidden></span></a>
      <a href="#puzzles" data-sec="puzzles" data-group="study">Puzzles <span class="tab-badge" id="pzBadge" hidden></span></a>
      <a href="#training" data-sec="training" data-group="study">Training</a>
      <a href="#games" data-sec="games" data-group="analyse">Games</a>
      <a href="#review" data-sec="review" data-group="analyse">Review</a>
      <a href="#journal" data-sec="journal" data-group="analyse">Journal <span class="tab-badge" id="jBadge" hidden></span></a>
      <a href="#insights" data-sec="insights" data-group="analyse">Insights</a>
      <a href="#time" data-sec="time" data-group="analyse">Time</a>
      <a href="#progress" data-sec="progress" data-group="analyse">Progress</a>
      <a href="#prepare" data-sec="prepare" data-group="analyse">Prepare</a>
      <span class="subnav-ink" aria-hidden="true"></span>
    </nav>
    <div class="account" id="account"></div>
  </div>

  <main class="coach-main" id="view" tabindex="-1"></main>

  <div class="story" id="story" role="dialog" aria-modal="true" aria-label="Study a discovery" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/coach/page.js"></script>
</body>
</html>
